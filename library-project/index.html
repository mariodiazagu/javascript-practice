<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="contenedorCanciones">

    </div>

    <button id="botonNuevaCancion">Nueva canción</button>

    <dialog id="dialogoNuevaCancion">
        <form id="formNuevaCancion">
            <input type="text" id="inputTitulo" placeholder="Título" required>
            <input type="text" id="inputArtista" placeholder="Artista" required>
            <input type="text" id="inputDuracion" placeholder="Duracion">
            <button id="botonSubmitNuevaCancion">Añadir</button>
        </form>
        <form id="formEliminarCancion">
            <div id="contenedorCanciones">
        </form>
        
    </dialog>

    <script src="script.js"></script>
</body>
</html>
